# IssuePilot: copy this file to .github/workflows/issuepilot.yml in your repository
# and add your Claude token as the CLAUDE_CODE_OAUTH_TOKEN secret. See docs/setup.md
# in brkakyldz/IssuePilot.

name: IssuePilot

on:
  issues:
    types: [opened]
  # Run it by hand on an existing issue: Actions > IssuePilot > Run workflow.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to investigate
        required: true

permissions: {}

jobs:
  issuepilot:
    # Pinned to a commit, not the movable v1 tag: this job holds the Claude token and may write issues.
    # cf06c3f is what v1 named on 2026-10-21; move it by hand after reading the new version.
    uses: brkakyldz/IssuePilot/.github/workflows/issuepilot.yml@cf06c3f29a824f72f19d432fe79a92bf38948168
    # The ceiling for IssuePilot's two jobs: the investigating job only ever gets
    # read access; the separate publishing job, which runs no AI, writes the comment.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue_number: ${{ inputs.issue_number }}
      language: English
