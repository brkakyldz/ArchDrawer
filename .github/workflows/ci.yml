# Offline gate only: no secrets, no paid or live calls. The browser suites run the
# fixture engine (docs/contracts/testing.md), never Claude Code or Codex.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Both suites always run, so one red suite does not hide the other's result.
      - run: npm run holdout
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: |
            test-results/
            test-results-e2e/
          retention-days: 7
